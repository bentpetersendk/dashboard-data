name: Update BioHPC stats

on:
  schedule:
    - cron: "58 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-biohpc-stats
  cancel-in-progress: false

jobs:
  update-biohpc-stats:
    name: Generate and publish BioHPC stats
    runs-on: ubuntu-latest

    env:
      DASHBOARD_DATA_BRANCH: ${{ vars.DASHBOARD_DATA_BRANCH || 'main' }}
      BIOHPC_STATS_OUTPUT_PATH: ${{ vars.BIOHPC_STATS_OUTPUT_PATH || 'biohpc/stats.json' }}
      BIOHPC_STATS_SOURCE_REPOSITORY: ${{ vars.BIOHPC_STATS_SOURCE_REPOSITORY || 'bentpetersendk/biohpc.github.io' }}
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_VIEW: ${{ vars.AIRTABLE_VIEW }}
      AIRTABLE_APPROVED_USERS_FORMULA: ${{ vars.AIRTABLE_APPROVED_USERS_FORMULA }}
      AIRTABLE_PENDING_USER_REQUESTS_FORMULA: ${{ vars.AIRTABLE_PENDING_USER_REQUESTS_FORMULA }}
      AIRTABLE_APPROVED_PIS_FORMULA: ${{ vars.AIRTABLE_APPROVED_PIS_FORMULA }}
      AIRTABLE_PENDING_PI_REQUESTS_FORMULA: ${{ vars.AIRTABLE_PENDING_PI_REQUESTS_FORMULA }}
      AIRTABLE_ACTIVE_PROJECTS_FORMULA: ${{ vars.AIRTABLE_ACTIVE_PROJECTS_FORMULA }}
      AIRTABLE_ORDERED_PROJECTS_FORMULA: ${{ vars.AIRTABLE_ORDERED_PROJECTS_FORMULA }}

    steps:
      - name: Log trigger context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          date -u

      - name: Checkout dashboard data
        uses: actions/checkout@v4
        with:
          repository: bentpetersendk/dashboard-data
          ref: ${{ env.DASHBOARD_DATA_BRANCH }}
          path: dashboard-data
          token: ${{ github.token }}

      - name: Checkout BioHPC website
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BIOHPC_STATS_SOURCE_REPOSITORY }}
          path: BioHPC_Website
          token: ${{ secrets.BIOHPC_WEBSITE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install BioHPC website dependencies
        working-directory: BioHPC_Website
        run: |
          python -m pip install --upgrade pip
          if [ ! -s requirements.txt ]; then
            echo "::error file=BioHPC_Website/requirements.txt::requirements.txt is missing or empty in $BIOHPC_STATS_SOURCE_REPOSITORY. Add the Python dependencies required by scripts/update_stats.py."
            exit 1
          fi
          python -m pip install -r requirements.txt

      - name: Validate BioHPC stats script dependencies
        working-directory: BioHPC_Website
        run: |
          python -m py_compile scripts/update_stats.py
          python -c "import runpy; runpy.run_path('scripts/update_stats.py', run_name='biohpc_stats_dependency_check')"

      - name: Generate BioHPC stats
        working-directory: BioHPC_Website
        run: |
          case "$BIOHPC_STATS_OUTPUT_PATH" in
            /*) ;;
            *) BIOHPC_STATS_OUTPUT_PATH="$GITHUB_WORKSPACE/dashboard-data/$BIOHPC_STATS_OUTPUT_PATH" ;;
          esac
          export BIOHPC_STATS_OUTPUT_PATH
          export STATS_OUTPUT_PATH="$BIOHPC_STATS_OUTPUT_PATH"
          mkdir -p "$(dirname "$BIOHPC_STATS_OUTPUT_PATH")"
          python scripts/update_stats.py

      - name: Commit and push changed stats
        working-directory: dashboard-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$BIOHPC_STATS_OUTPUT_PATH"

          if git diff --cached --quiet -- "$BIOHPC_STATS_OUTPUT_PATH"; then
            echo "$BIOHPC_STATS_OUTPUT_PATH is unchanged; skipping commit."
            exit 0
          fi

          git commit -m "Update BioHPC stats"
          git push origin "HEAD:$DASHBOARD_DATA_BRANCH"
